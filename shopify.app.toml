# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "64d8f47751b082f800d95f75feca1a52"
name = "Drop a Hint Pro"
application_url = "https://drop-a-hint-production-5901.up.railway.app" 
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "orders/create" ]
  uri = "/webhooks/orders/create"

  [[webhooks.subscriptions]]
  topics = [ "orders/paid" ]
  uri = "/webhooks/orders/paid"

  [[webhooks.subscriptions]]
  topics = [ "orders/cancelled" ]
  uri = "/webhooks/orders/cancelled"

  [[webhooks.subscriptions]]
  topics = [ "discounts/delete" ]
  uri = "/webhooks/discounts/delete"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "/webhooks/compliance"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,write_discounts,read_orders,read_customers"

[auth]
redirect_urls = [ "https://drop-a-hint-production-5901.up.railway.app/api/auth" ]

[app_proxy]
url = "https://drop-a-hint-production-5901.up.railway.app/api/proxy"
subpath = "drop-a-hint"
prefix = "apps"